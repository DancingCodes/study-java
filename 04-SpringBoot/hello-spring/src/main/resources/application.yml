spring:
  profiles:
    active: dev    # 默认激活 dev 环境

# JWT 配置
jwt:
  secret: DancingCodes-hello-spring-jwt-secret-key-2024-must-be-at-least-32-bytes
  expiration: 86400000  # 24 小时（毫秒）

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      table-prefix: ""
      id-type: auto

# 自定义配置示例
app:
  name: hello-spring
  version: 1.0.0
