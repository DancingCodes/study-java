# 练习 3：前后端分离部署
# 前端静态文件由 Nginx 直接处理，API 请求代理到后端
#
# 使用方法：
#   1. 把 nginx-demo/html/ 目录下的 index.html 复制到 nginx/html/ 目录
#   2. 把这个文件的内容复制到 nginx.conf 的 http 块中
#   3. nginx.exe -s reload
#   4. 启动 Spring Boot 应用（8080 端口）
#   5. 访问 http://localhost 看到静态页面
#   6. 访问 http://localhost/api/xxx 会被代理到后端

