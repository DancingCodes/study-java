# Nginx 练习说明
#
# 前提：已下载 Nginx 并解压到本地（如 D:\nginx）
#
# 练习步骤：
#   1. 选择一个练习配置文件（proxy.conf / loadbalance.conf / frontend.conf）
#   2. 将其内容复制到 nginx/conf/nginx.conf 的 http 块中（替换原有 server 块）
#   3. 在 nginx 目录下运行 nginx.exe -t 检查配置
#   4. 运行 nginx.exe -s reload 重新加载
#   5. 浏览器访问 http://localhost 测试
#
# 如果之后学了 Docker，也可以用 docker-compose 方式启动：
#   1. 复制练习配置为 conf/default.conf
#   2. docker-compose up -d

version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-demo
    ports:
      - "80:80"
    volumes:
      - ./conf/default.conf:/etc/nginx/conf.d/default.conf
      - ./html:/usr/share/nginx/html
