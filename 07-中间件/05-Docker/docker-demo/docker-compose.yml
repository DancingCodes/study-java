# 练习 2：Docker Compose 一键部署
#
# 使用方法：
#   1. 先在 app 目录下执行 mvn clean package -DskipTests
#   2. docker-compose up -d
#   3. 访问 http://localhost:8080/health 查看 MySQL 和 Redis 连接状态
#   4. docker-compose logs -f app 查看应用日志
#   5. 结束：docker-compose down

